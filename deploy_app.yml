---
- name: Deploy App
  hosts: all
  become: true
  vars:
    repo_url: "https://github.com/yasirkelesh/INCEPTION.git"  # GitHub reposu URL'si
    repo_name: "INCEPTION"  # Depo adı (aynı zamanda klasör adı olacak)
  tasks:
    - name: GitHub reposunu klonla
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "/home/{{ ansible_user }}/{{ repo_name }}"
        update: yes
    
    - name: .env dosyasını oluştur
      ansible.builtin.shell: |
        cd /home/{{ ansible_user }}/{{ repo_name }}/srcs
        cat > .env <<EOF
        EOF
      args:
        executable: /bin/bash


    - name: Docker servisini başlat
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: sertfika al
      ansible.builtin.shell: |
        cd /home/{{ ansible_user }}/{{ repo_name }}/srcs
        bash letsEncrypt.sh

    - name: Docker ile uygulamayı çalıştır
      ansible.builtin.shell: |
        cd /home/{{ ansible_user }}/{{ repo_name }}
        make all
      args:
        chdir: "/home/{{ ansible_user }}/{{ repo_name }}"
